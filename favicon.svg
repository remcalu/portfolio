<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RC monogram">
  <!-- Tokens from src/styles/tokens.css to match the site accent -->
  <rect width="64" height="64" rx="14" fill="#EFEFEC"/>
  <!-- Transit-line motif: the route node -->
  <circle cx="20" cy="32" r="6" fill="#C79535" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="44" cy="32" r="6" fill="#1A1A1A"/>
  <line x1="26" y1="32" x2="38" y2="32" stroke="#C79535" stroke-width="3"/>
  <!-- Tiny arrowhead at destination -->
  <polygon points="38,26 48,32 38,38" fill="#C79535"/>
</svg>
